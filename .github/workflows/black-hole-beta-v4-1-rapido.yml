      - name: Preparar compilacao otimizada assinada para teste
        shell: bash
        run: |
          python3 - <<'PY_SIGN'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          src = path.read_text(encoding='utf-8')
          old = '''        create("localRelease") {
            initWith(getByName("release"))
            applicationIdSuffix = localReleaseApplicationIdSuffix.get()'''
          new = '''        create("localRelease") {
            initWith(getByName("release"))
            // SOMENTE DEMO: assina o release otimizado com chave DEBUG efemera da CI.
            // Nao e versao publica nem pode ser usada com credenciais reais.
            signingConfig = signingConfigs.getByName("debug")
            applicationIdSuffix = localReleaseApplicationIdSuffix.get()'''
          assert src.count(old) == 1, "Nao foi possivel localizar localRelease no build.gradle.kts"
          path.write_text(src.replace(old, new, 1), encoding='utf-8')
          print('Build fullLocalRelease otimizado com assinatura debug para testes locais.')
          PY_SIGN
      - name: Compilar testes e Black Hole Release otimizado
        run: >-
          ./gradlew --no-daemon
          -Pcandy.localReleaseApplicationIdSuffix=.beta4perf
          '-Pcandy.localReleaseAppLabel=Black Hole Rapido (Teste)'
          -Pcandy.releaseAbi=arm64-v8a
          :app:testFullDebugUnitTest :app:assembleFullLocalRelease
      - name: Guardar APK Black Hole V4.1 otimizado - SOMENTE TESTE
        uses: actions/upload-artifact@v4
        with:
          name: black-hole-beta-v4-1-rapido-TESTE
          path: app/build/outputs/apk/full/localRelease/*.apk
          if-no-files-found: error
          retention-days: 3
