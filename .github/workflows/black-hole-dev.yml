name: Black Hole Dev - optimized test build

on:
  workflow_dispatch:
  push:
    branches: [black-hole-dev]
    paths:
      - '.github/workflows/black-hole-dev.yml'
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/**'
      - 'release-notes/**'
      - 'sync/protocol/**'

permissions:
  contents: read

jobs:
  optimized-test:
    if: github.ref == 'refs/heads/black-hole-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out versioned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1"
      - name: Verify branding resources and artwork
        run: |
          python3 -m unittest discover -s scripts -p test_generate_black_hole_branding.py
          python3 scripts/generate_black_hole_branding.py
          git diff --exit-code -- app/src/blackHoleTest/res
      - name: Test, lint and build
        # Experimental APK only. No production signing secrets or source patches.
        # Use fabricated accounts only; never publish this test-signed application.
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Pcandy.releaseAbi=arm64-v8a
          :app:testFullDebugUnitTest :app:testFossDebugUnitTest
          :app:lintFullDebug :app:lintFossDebug
          :app:assembleFullDebug :app:assembleFossDebug
          :app:lintFullBlackHoleTest :app:assembleFullBlackHoleTest
      - name: Check optimized APK identity and R8 output
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/full/blackHoleTest/app-full-blackHoleTest.apk
          test -s "$apk"
          test -s app/build/outputs/mapping/fullBlackHoleTest/mapping.txt
          test "$(apkanalyzer manifest application-id "$apk")" = 'dev.sk2andy.materialbrowser.blackholedev'
          test "$(apkanalyzer manifest debuggable "$apk")" = 'false'
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: black-hole-dev-validation
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Save experimental APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: black-hole-dev-arm64-TESTE
          path: app/build/outputs/apk/full/blackHoleTest/*.apk
          if-no-files-found: error
          retention-days: 3

  branding-device-test:
    if: github.ref == 'refs/heads/black-hole-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out versioned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1"
      - name: Build optimized app and branding instrumented tests
        # Keep the x86_64 ABI for the dedicated emulator; the downloadable APK remains ARM64.
        run: >-
          ./gradlew --no-daemon --max-workers=1
          -Pcandy.androidTestBuildType=blackHoleTest
          :app:assembleFullBlackHoleTest :app:assembleFullBlackHoleTestAndroidTest
      - name: Enable KVM for the dedicated emulator
        run: sudo chmod 666 /dev/kvm
      - name: Test branding and launcher selection on Android 35
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb -s "$ANDROID_SERIAL" wait-for-device
            ./gradlew --no-daemon --max-workers=1 -Pcandy.androidTestBuildType=blackHoleTest -Pandroid.testInstrumentationRunnerArguments.class=dev.sk2andy.materialbrowser.data.BlackHoleBrandingInstrumentedTest :app:connectedFullBlackHoleTestAndroidTest
      - name: Save branding device reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: black-hole-dev-branding-device-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 3
