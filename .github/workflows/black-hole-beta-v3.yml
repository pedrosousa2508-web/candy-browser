      - name: Compilar e executar testes unitarios
        run: >-
          ./gradlew --no-daemon
          -Pcandy.debugApplicationIdSuffix=.beta
          '-Pcandy.debugAppLabel=Black Hole Beta'
          -Pcandy.releaseAbi=arm64-v8a
          :app:testFullDebugUnitTest :app:assembleFullDebug
      - name: Guardar APK Black Hole Beta V3 (senhas ficticias)
        uses: actions/upload-artifact@v4
        with:
          name: black-hole-beta-v3-apk-TESTE
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 3
