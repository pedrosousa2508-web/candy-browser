        run: >-
          ./gradlew --no-daemon
          -Pcandy.debugApplicationIdSuffix=.csv2
          '-Pcandy.debugAppLabel=Candy CSV Teste 2'
          -Pcandy.releaseAbi=arm64-v8a
          :app:testFullDebugUnitTest :app:assembleFullDebug
      - name: Guardar APK v2 de teste - SEM senhas reais
        uses: actions/upload-artifact@v4
        with:
          name: candy-importar-exportar-csv-v2-apk-TESTE
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 3
