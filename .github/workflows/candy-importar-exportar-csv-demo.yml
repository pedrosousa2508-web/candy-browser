# DEMO: apenas senhas inventadas; CSV sem criptografia.
# Protótipo EXCLUSIVAMENTE para demonstracao com senhas inventadas.
# NÃO execute importacoes de credenciais reais nesta versao.
# Este workflow monta um APK debug do seu fork do Candy Browser.
# O codigo-fonte do prototipo tambem esta disponivel no ZIP compartilhado no chat.
name: Candy - Importar e exportar CSV (DEMO v2)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/candy-importar-exportar-csv-demo.yml'

permissions:
  contents: read

jobs:
  demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar codigo Candy do fork
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar Android SDK 37.1
        run: sdkmanager "platforms;android-37.1"
      - name: Preparar importador CSV demonstrativo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/candy_csv_demo
          base64 -d > /tmp/candy_csv_demo.zip <<'ZIP64'
